# Zabbix Agent 2 UserParameters for IBM MQ. Drop into /etc/zabbix/zabbix_agent2.d/ and restart the agent.
# Each key returns one JSON document: use it as the master item of a low-level discovery rule, with
# dependent items and JSONPath preprocessing (see README.md). Only the first argument is passed to the
# script, quoted, so a queue manager name cannot inject shell.
UserParameter=ibmmq.qmgrs,/etc/zabbix/scripts/mq_zbx.sh qmgrs
UserParameter=ibmmq.queues[*],/etc/zabbix/scripts/mq_zbx.sh queues "$1"
UserParameter=ibmmq.channels[*],/etc/zabbix/scripts/mq_zbx.sh channels "$1"
